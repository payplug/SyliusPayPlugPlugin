<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img">
  <title>Cart amount range</title>
  <rect width="400" height="230" rx="12" fill="#f1f3f6"/>
  <rect x="20" y="16" width="360" height="198" rx="8" fill="#ffffff"/>
  <line x1="50" y1="130" x2="350" y2="130" stroke="#d0d5dd" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="130" x2="270" y2="130" stroke="#1f5af6" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="78" x2="130" y2="116" stroke="#1f5af6" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="270" y1="78" x2="270" y2="116" stroke="#1f5af6" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="130" cy="130" r="14" fill="#1f5af6" stroke="#ffffff" stroke-width="4"/>
  <circle cx="270" cy="130" r="14" fill="#1f5af6" stroke="#ffffff" stroke-width="4"/>
  <text x="130" y="68" font-family="sans-serif" font-size="20" fill="#1f5af6" text-anchor="middle">250 €</text>
  <text x="270" y="68" font-family="sans-serif" font-size="20" fill="#1f5af6" text-anchor="middle">1500 €</text>
  <text x="50" y="166" font-family="sans-serif" font-size="14" fill="#344054">100 €</text>
  <text x="350" y="166" font-family="sans-serif" font-size="14" fill="#344054" text-anchor="end">3000 €</text>
</svg>
